[workspace]
authors = ["Luis Pedro Coelho <luis@luispedro.org>"]
channels = ["conda-forge", "https://conda.anaconda.org/bioconda"]
name = "ngless_test"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]

[package]
# For "normal" versions such as this one, the version matches Cargo.toml. It only
# needs to differ for pre-releases, because of different conventions between Cargo
# and conda (-beta vs .beta).
version = "1.6.0"

[package.build]
backend = { name = "pixi-build-rust", version = "*" }

[dependencies]
prodigal = ">=2.6.3,<3"
megahit = ">=1.2.9,<2"
samtools = ">=1.23.1,<2"
minimap2 = ">=2.31,<3"
bwa = ">=0.7.19,<0.8"
